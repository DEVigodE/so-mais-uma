name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bloqueia certificados, chaves e .env versionados
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..*)?|.*\.(key|crt|pem|pfx|p12|jks|keystore))$' | grep -v '\.env\.exemplo$'; then
            echo 'Segredo versionado encontrado'; exit 1; fi

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Build e testes (Testcontainers usa o Docker do runner)
        run: chmod +x mvnw && ./mvnw -B verify
        env:
          SPRING_PROFILES_ACTIVE: simulado
          JWT_SECRET: ci-somente-teste-chave-com-mais-de-32-bytes-0123
          DEV_KEY: ci-dev-key
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
      - name: Projeto Flutter ainda não existe
        if: hashFiles('frontend/pubspec.yaml') == ''
        run: echo "Sem frontend/pubspec.yaml no repositório; job ignorado até o projeto Flutter ser criado."
      # JDK para o Gradle do Android usado pelo flutter build apk
      - uses: actions/setup-java@v4
        if: hashFiles('frontend/pubspec.yaml') != ''
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        if: hashFiles('frontend/pubspec.yaml') != ''
        with: { channel: stable, flutter-version: '3.47.6', cache: true }
      - name: Dependências, geração de código, análise e testes
        if: hashFiles('frontend/pubspec.yaml') != ''
        working-directory: frontend
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
          flutter test
      - name: APK debug
        if: hashFiles('frontend/pubspec.yaml') != ''
        working-directory: frontend
        run: flutter build apk --debug --dart-define-from-file=config/dev.json.exemplo
      - name: Artefato APK debug
        if: hashFiles('frontend/pubspec.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
