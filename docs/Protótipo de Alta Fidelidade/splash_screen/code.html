<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium tracking-wide">CONNECTING</span>

<span class="material-symbols-outlined text-sm">bolt</span>

<div class="flex flex-col items-center justify-center text-center relative z-10 my-auto w-full max-w-xs">

</div>
<div class="absolute -bottom-2 -right-2 bg-primary text-on-primary rounded-full p-1.5 shadow-md flex items-center justify-center">

<div class="flex flex-col items-center gap-1 mb-2"><span class="font-label-md text-label-md text-primary tracking-widest uppercase font-bold text-center">Arena Digital</span><h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-bold tracking-tight text-center leading-tight">Só mais uma</h1></div>
<p class="font-body-md text-body-md text-on-surface-variant font-medium text-center px-4 max-w-xs">Sua arena esportiva a um toque</p>
<div class="mt-10 flex flex-col items-center gap-3 w-full">
<div class="relative w-10 h-10 flex items-center justify-center">
<svg class="animate-spin w-10 h-10 text-primary" fill="none" viewBox="0 0 48 48">
<circle class="opacity-20" cx="24" cy="24" r="18" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-90" d="M24 6a18 18 0 0 1 18 18h-4a14 14 0 0 0-14-14V6z" fill="currentColor"></path>
</svg>
<span class="material-symbols-outlined text-xs text-primary absolute">timer</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant font-medium transition-all duration-300" id="splash-status" style="opacity: 1;">Tudo pronto para o jogo!</p>
</div>
</div>
<div class="w-full flex flex-col items-center gap-2 relative z-10 pb-2">
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-1.5 rounded-full shadow-sm">
<span class="material-symbols-outlined text-sm text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Modo seguro • Sincronização local</span>
</div>
<div class="flex items-center gap-2 text-outline">
<span class="font-label-sm text-label-sm">v1.0.0 (Build 2026)</span>
<span class="">•</span>
<span class="font-label-sm text-label-sm font-semibold text-primary">RNF08 / RNF11</span>
</div>
</div>
</div>
<script>
  (function() {
    const statusMessages = [
      'Carregando suas partidas...',
      'Sincronizando quadras próximas...',
      'Tudo pronto para o jogo!'
    ];
    let step = 0;
    const label = document.getElementById('splash-status');
    if (label) {
      const interval = setInterval(() => {
        step++;
        if (step < statusMessages.length) {
          label.style.opacity = '0';
          setTimeout(() => {
            label.textContent = statusMessages[step];
            label.style.opacity = '1';
          }, 180);
        } else {
          clearInterval(interval);
        }
      }, 1400);
    }
  })();
</script></main>
